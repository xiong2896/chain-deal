<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>发现门店 · 链享团购</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo-mark">链</div>
      <div>
        <div class="logo">链享团购</div>
        <div class="slogan">CHAIN DEAL · 到店套餐</div>
      </div>
    </div>

    <div class="global-search">
      <input id="kw" placeholder="搜店名，或试试：人均 100 以内的火锅、评分 4.5 以上的 KTV" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">搜索</button>
    </div>

    <span class="spacer"></span>
    <a class="u-link" href="javascript:;" onclick="goMine()" id="userLink">登录</a>
  </div>
</header>

<main class="wrap">

  <section class="hero-band">
    <div class="hero-title">发现附近 <em>优质门店</em></div>
    <div class="hero-sub">连锁品牌直营 · 限量套餐秒杀 · 到店核销即用 · 支持自然语言找店</div>

    <div class="ai-examples">
      <span class="label">AI 找店试试：</span>
      <button onclick="quickSearch('人均100以内的火锅')">人均100以内的火锅</button>
      <button onclick="quickSearch('评分4.5以上的KTV')">评分4.5以上的KTV</button>
      <button onclick="quickSearch('运河附近的店')">运河附近的店</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">附近门店</div><div class="v" id="stShop">—</div></div>
      <div class="stat"><div class="k">在售套餐</div><div class="v" id="stVoucher">—<small>个</small></div></div>
      <div class="stat"><div class="k">品类覆盖</div><div class="v" id="stType">—<small>类</small></div></div>
      <div class="stat"><div class="k">当前定位</div><div class="v" style="font-size:16px;color:var(--text);text-shadow:none">杭州</div></div>
    </div>
  </section>

  <div class="layout">
    <aside class="side">
      <h4>门店品类</h4>
      <div class="cats" id="cats"></div>
      <h4>排序方式</h4>
      <div class="sorts">
        <span class="sort on" data-sort="" onclick="pickSort('', this)">综合</span>
        <span class="sort" onclick="toast('距离排序需开启定位，暂未接入')">距离</span>
        <span class="sort" data-sort="sold" onclick="pickSort('sold', this)">人气</span>
        <span class="sort" data-sort="price" onclick="pickSort('price', this)">价格</span>
      </div>
    </aside>

    <section>
      <div class="grid-head">
        <div class="t">为你找到 <b id="cnt">0</b> 家门店</div>
        <div class="t" style="font-size:12.5px;color:var(--dim)">数据来源：/shop/of/type · /shop/ai-search</div>
      </div>
      <div id="aiTip" class="ai-tip" style="display:none"></div>
      <div class="grid" id="list"></div>
    </section>
  </div>

</main>

<script src="assets/app.js"></script>
<script>
let curType = null;
let curSort = '';        // ''-综合, 'sold'-人气, 'priceAsc'-价格升序, 'priceDesc'-价格降序
let priceAsc = true;     // 价格按钮下一次点击是否按升序

function pickSort(type, el) {
  if (type === 'price') {
    curSort = priceAsc ? 'priceAsc' : 'priceDesc';
    el.textContent = priceAsc ? '价格 ↑' : '价格 ↓';
    priceAsc = !priceAsc;
  } else {
    curSort = type;
    const priceEl = document.querySelector('.sorts .sort[data-sort="price"]');
    if (priceEl) priceEl.textContent = '价格';
    priceAsc = true;
  }
  document.querySelectorAll('.sorts .sort').forEach(s => s.classList.remove('on'));
  el.classList.add('on');
  refreshList();
}

// 有搜索词就刷新搜索结果，否则刷新分类列表
function refreshList() {
  const kw = document.getElementById('kw').value.trim();
  if (kw) doSearch(); else loadShops();
}

function goMine() {
  if (getToken()) location.href = 'profile.html';
  else location.href = 'login.html?from=index.html';
}

function skeleton(n) {
  return Array.from({length: n}).map(() => `
    <div class="sk">
      <div class="b img"></div>
      <div style="flex:1">
        <div class="b t1"></div><div class="b t2"></div><div class="b t3"></div>
      </div>
    </div>`).join('');
}

function thumbHtml(s) {
  const img = shopImg(s);
  const initial = esc((s.name || '店').charAt(0));
  if (img) {
    return `<div class="thumb-wrap">
        <img src="${esc(img)}" alt="" loading="lazy"
             onerror="this.style.display='none';this.parentNode.querySelector('.thumb-fb').style.display='flex'">
        <div class="thumb-fb" style="display:none">${initial}</div>
        <span class="v-badge">券</span>
      </div>`;
  }
  return `<div class="thumb-wrap">
      <div class="thumb-fb">${initial}</div>
      <span class="v-badge">券</span>
    </div>`;
}

function cardHtml(s) {
  const score = fmtScore(s.score);
  const tags = [];
  if (s.area) tags.push(`<span class="tag">${esc(s.area)}</span>`);
  if (s.openHours) tags.push(`<span class="tag warm">${esc(String(s.openHours).split('-')[0])} 营业</span>`);

  return `<article class="card" onclick="location.href='shop.html?id=${s.id}'">
    ${thumbHtml(s)}
    <div class="info">
      <h3>${esc(s.name)}</h3>
      <div class="score-line">
        ${score ? `<span class="score-badge">${score}<small>分</small></span>` : '<span>暂无评分</span>'}
        <span>已售 ${s.sold || 0}</span>
      </div>
      <div class="price-line">
        <span class="price">¥${s.avgPrice || '—'}<small>/人</small></span>
        <span class="sold">›</span>
      </div>
      <div class="addr-line">${esc(s.address || '')}</div>
      ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
    </div>
  </article>`;
}

async function loadCats() {
  const box = document.getElementById('cats');
  try {
    const list = await req('/shop-type/list');
    document.getElementById('stType').innerHTML = list.length + '<small>类</small>';
    box.innerHTML = list.map(t =>
      `<div class="cat" data-id="${t.id}" onclick="pickType(${t.id}, this)">${esc(t.name)}</div>`
    ).join('');
    if (list.length) pickType(list[0].id, box.firstElementChild);
  } catch (e) {
    box.innerHTML = '';
    document.getElementById('list').innerHTML =
      `<div class="empty"><span class="big">⚠️</span>分类加载失败：${esc(e.message)}</div>`;
  }
}

async function pickType(id, el) {
  curType = id;
  document.querySelectorAll('.cat').forEach(c => c.classList.remove('on'));
  if (el) el.classList.add('on');
  await loadShops();
}

async function loadShops() {
  showAiTip(null);
  const box = document.getElementById('list');
  box.innerHTML = skeleton(4);
  try {
    const sortParam = curSort ? `&sortBy=${curSort}` : '';
    const shops = await req(`/shop/of/type?typeId=${curType}&current=1${sortParam}`);
    const list = shops || [];
    document.getElementById('cnt').textContent = list.length;
    document.getElementById('stShop').textContent = list.length;
    let vSum = 0;
    list.forEach(s => vSum += 1);
    document.getElementById('stVoucher').innerHTML = (vSum * 1 > 0 ? list.length : 0) + '<small>个</small>';
    if (!list.length) {
      box.innerHTML = '<div class="empty"><span class="big">🍽️</span>该分类下暂无门店</div>';
      return;
    }
    box.innerHTML = list.map(cardHtml).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty"><span class="big">⚠️</span>加载失败：${esc(e.message)}</div>`;
  }
}

// 点击示例：填入搜索框并立即搜索
function quickSearch(text) {
  document.getElementById('kw').value = text;
  doSearch();
}

async function doSearch() {
  const kw = document.getElementById('kw').value.trim();
  if (!kw) return loadShops();
  const box = document.getElementById('list');
  box.innerHTML = skeleton(3);
  try {
    const sortParam = curSort ? `&sortBy=${curSort}` : '';
    // 统一走 AI 找店接口：自然语言由大模型解析，普通店名后端自动走关键词搜索
    const data = await req('/shop/ai-search?q=' + encodeURIComponent(kw) + sortParam);
    const list = data.shops || [];
    document.getElementById('cnt').textContent = list.length;
    document.getElementById('stShop').textContent = list.length;
    showAiTip(data);
    if (!list.length) {
      box.innerHTML = `<div class="empty"><span class="big">🔍</span>没有找到「${esc(kw)}」相关门店。试试更完整的说法，如「人均100以内的火锅」「评分4.5以上的KTV」</div>`;
      return;
    }
    box.innerHTML = list.map(cardHtml).join('');
  } catch (e) {
    showAiTip(null);
    box.innerHTML = `<div class="empty"><span class="big">⚠️</span>搜索失败：${esc(e.message)}</div>`;
  }
}

// 展示 AI 解析出的条件；降级时用橙色提示
function showAiTip(data) {
  const tip = document.getElementById('aiTip');
  if (!data || (!data.aiUsed && !data.degraded)) {
    tip.style.display = 'none';
    return;
  }
  tip.style.display = 'block';
  tip.className = data.degraded ? 'ai-tip warn' : 'ai-tip';
  tip.textContent = data.summary || '';
}

(function initUser() {
  document.getElementById('userLink').textContent = getToken() ? '我的' : '登录';
})();
loadCats();
</script>
</body>
</html>
