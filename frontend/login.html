<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 链享团购</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body style="padding-bottom:0">

<div class="login-page">
  <div class="login-box">
    <div class="login-logo">链</div>
    <h1>链享团购</h1>
    <p class="sub">连锁品牌到店团购 · 限量套餐 · 到店核销</p>

    <div class="field">
      <label>手机号</label>
      <input id="phone" type="tel" maxlength="11" placeholder="请输入 11 位手机号" value="13800138000">
    </div>

    <div class="field">
      <label>验证码</label>
      <div class="row">
        <input id="code" maxlength="6" placeholder="6 位数字" inputmode="numeric">
        <button class="btn" id="sendBtn" onclick="sendCode()">获取验证码</button>
      </div>
    </div>

    <button class="btn btn-block" onclick="doLogin()">登 录</button>

    <p class="tip">验证码不发短信，请查看后端控制台打印的 6 位数字</p>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
let counting = false;

async function sendCode() {
  if (counting) return;
  const phone = document.getElementById('phone').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) return toast('手机号格式不对');

  try {
    await req('/user/code?phone=' + encodeURIComponent(phone), { method: 'POST' });
    toast('已发送，请查看后端控制台');
  } catch (e) {
    return toast(e.message);
  }

  const btn = document.getElementById('sendBtn');
  let left = 60;
  counting = true;
  btn.disabled = true;
  btn.textContent = left + 's';
  const timer = setInterval(() => {
    left--;
    btn.textContent = left + 's';
    if (left <= 0) {
      clearInterval(timer);
      counting = false;
      btn.disabled = false;
      btn.textContent = '获取验证码';
    }
  }, 1000);
}

async function doLogin() {
  const phone = document.getElementById('phone').value.trim();
  const code = document.getElementById('code').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) return toast('手机号格式不对');
  if (!code) return toast('请输入验证码');

  try {
    const token = await req('/user/login', {
      method: 'POST',
      body: JSON.stringify({ phone, code })
    });
    setToken(token);
    toast('登录成功');
    const from = qs('from') || 'index.html';
    setTimeout(() => location.href = from, 400);
  } catch (e) {
    toast(e.message);
  }
}

if (getToken() && !qs('force')) location.href = qs('from') || 'index.html';
</script>
</body>
</html>
